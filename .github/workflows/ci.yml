name: Build, Scan, and Push Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # --- Node.js & Automated Unit Tests ---
    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Automated Unit Tests
      run: npm test

    - name: Build Docker Image
      run: docker build -t devops-app:latest .

    - name: Run Trivy vulnerability Scanner (Enforcement)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'devops-app:latest'
        format: 'table'
        exit-code: '1' 
        ignore-unfixed: true
        vuln-type: 'library'
        severity: 'CRITICAL'
    - name: Log in to GitHub Container Registry
      if: success() # only build if build dan scan successful
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Push image to GHCR
      if: success() # only push if build dan scan successful
      run: | 
        IMAGE_ID=ghcr.io/${{ github.repository_owner }}/devops-app:latest
        IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]') # Mengubah nama image menjadi lowercase
        docker tag devops-app:latest $IMAGE_ID
        docker push $IMAGE_ID