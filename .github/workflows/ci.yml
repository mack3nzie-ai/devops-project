name: Build, Scan, and Push Docker Image

on:
  push:
    branches: [ "main" ]


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: docker build -t devops-app:latest .

    - name: Run Trivy vulnerability Scanner (Enforcement)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'devops-app:latest'
        format: 'table'
        exit-code: '1' #Menggagalkan pipeline jika ada kerentanan CRITICAL
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL'
    - name: Log in to GitHub Container Registry
      if: success() # Hanya login jika build dan scan berhasil
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Push image to GHCR
      if: success() # only push if build dan scan berhasil
      run: | 
        IMAGE_ID=ghcr.io/${{ github.repository_owner }}/devops-app:latest
        IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]') # Mengubah nama image menjadi lowercase
        docker tag devops-app:latest $IMAGE_ID
        docker push $IMAGE_ID